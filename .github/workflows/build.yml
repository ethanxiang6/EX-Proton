# EX-Proton build workflow.
#
# Follows GloriousEggroll/proton-ge-custom .github/workflows/_job_build.yml
# (free disk space, host ccache + fontforge, ccache cache, GE patch step, CI
# strip patch, build in ./build, artifact upload), adapted to this overlay repo
# where Proton-GE is the `proton` submodule.
#
# Third-party actions (not published by GitHub/"actions"):
#   - endersonmenezes/free-disk-space  (pinned to a full version tag)
# Everything else is from the first-party "actions" organisation. The release
# job uses the gh CLI preinstalled on the runner and the default GITHUB_TOKEN.

name: Build EX-Proton

on:
  workflow_dispatch:
    inputs:
      build-name:
        description: "Build name (shown in Steam, used for the tarball name)"
        required: false
        default: "EX-Proton11-1"
        type: string
  push:
    tags:
      - "EX-Proton*"

concurrency:
  group: ex-proton-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    env:
      # Inputs/refs are passed through env, never interpolated into scripts.
      INPUT_BUILD_NAME: ${{ inputs.build-name }}
      REF_TYPE: ${{ github.ref_type }}
      REF_NAME: ${{ github.ref_name }}
      # Variables starting with CCACHE_ are forwarded into Proton's container
      # by Proton's Makefile.in (CCACHE_ENV).
      CCACHE_MAXSIZE: 4G
    steps:
      - name: Determine build name
        id: name
        shell: bash
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            name="$REF_NAME"
          else
            name="${INPUT_BUILD_NAME:-EX-Proton11-1}"
          fi
          if ! [[ "$name" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid build name: '$name' (allowed: A-Z a-z 0-9 . _ -)" >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Build name: $name"

      # Third-party action. Inputs limited to those present in v3.2.2's action.yaml.
      - name: Free disk space
        uses: endersonmenezes/free-disk-space@v3.2.2
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: |
            azure-cli google-cloud-cli google-chrome-stable firefox microsoft-edge-stable
            postgresql* mysql* php* temurin-* *llvm* clang* mono-devel powershell dotnet-sdk-*
          remove_folders: |
            /usr/share/swift /usr/share/miniconda /usr/local/lib/node_modules
            /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia*
            /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle /usr/share/az*
            /usr/local/.ghcup

      # Same host packages as Proton-GE's CI.
      - name: Prepare host
        run: sudo apt-get update && sudo apt-get install -y ccache fontforge-nox

      - name: Disk usage before build
        run: df -h

      # Submodules are deliberately NOT fetched here; scripts/prepare.sh does it.
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          submodules: false

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v4.3.0
        with:
          path: ~/.ccache
          key: ccache-ex-proton-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-ex-proton-${{ runner.os }}-

      - name: Prepare Proton tree (submodules, overrides, GE patches, our patches)
        run: ./scripts/prepare.sh --jobs "$(nproc)"

      - name: Upload prepare log
        if: always()
        uses: actions/upload-artifact@v5.0.0
        with:
          name: prepare-ge-log
          path: |
            prepare-ge.log
            prepare-ge.rejects
          if-no-files-found: ignore

      # CI only: build without debug info (-ggdb -> -s) so the build fits on a
      # hosted runner's disk. This is Proton-GE's own CI patch, applied the way
      # GE's CI applies it (patch -Np1; it needs fuzz, so `git apply` rejects it).
      - name: Strip binaries early (CI disk saving)
        working-directory: ./proton
        run: |
          patch -Np1 -i ./.github/patches/0001-build-strip-binaries-early.patch
          grep -n '^CFLAGS += -s ' Makefile.in

      - name: Configure
        shell: bash
        env:
          BUILD_NAME: ${{ steps.name.outputs.name }}
        run: |
          set -euo pipefail
          mkdir build
          cd build
          # The SDK image comes from the Proton tree's Makefile.in default
          # (steamrt4); it is intentionally not overridden here.
          ../proton/configure.sh --container-engine=docker --build-name="$BUILD_NAME"
          make --silent get-steamrt-image || true

      # Proton-GE's `make redist` creates <name>.tar.gz and <name>.sha512sum in
      # the build directory itself.
      - name: Make redist
        working-directory: ./build
        run: |
          df -h
          make -j"$(nproc)" redist

      - name: Disk usage after build
        if: always()
        run: df -h

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4.3.0
        with:
          path: ~/.ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Check tarball
        shell: bash
        env:
          BUILD_NAME: ${{ steps.name.outputs.name }}
        run: |
          set -euo pipefail
          cd build
          ls -lh "${BUILD_NAME}.tar.gz" "${BUILD_NAME}.sha512sum"
          sha512sum -c "${BUILD_NAME}.sha512sum"
          # List to a file first: piping tar into `grep -m1` makes tar fail with
          # SIGPIPE under pipefail.
          tar -tzf "${BUILD_NAME}.tar.gz" > tarball-contents.txt
          grep -x "${BUILD_NAME}/compatibilitytool.vdf" tarball-contents.txt
          grep -c "/lib/wine/dxvk-low-latency/\|/lib/wine/vkd3d-low-latency/" tarball-contents.txt || true

      - name: Upload tarball
        uses: actions/upload-artifact@v5.0.0
        with:
          name: ${{ steps.name.outputs.name }}.tar.gz
          path: ./build/${{ steps.name.outputs.name }}.tar.gz
          if-no-files-found: error

      - name: Upload checksum
        uses: actions/upload-artifact@v5.0.0
        with:
          name: ${{ steps.name.outputs.name }}.sha512sum
          path: ./build/${{ steps.name.outputs.name }}.sha512sum
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download tarball
        uses: actions/download-artifact@v5.0.0
        with:
          name: ${{ github.ref_name }}.tar.gz
          path: dist

      - name: Download checksum
        uses: actions/download-artifact@v5.0.0
        with:
          name: ${{ github.ref_name }}.sha512sum
          path: dist

      - name: Verify checksum
        run: |
          cd dist
          sha512sum -c "${TAG}.sha512sum"

      - name: Create or update release
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; uploading assets (clobber)."
            gh release upload "$TAG" "dist/${TAG}.tar.gz" "dist/${TAG}.sha512sum" --clobber
          else
            gh release create "$TAG" "dist/${TAG}.tar.gz" "dist/${TAG}.sha512sum" \
              --verify-tag --title "$TAG" \
              --notes "EX-Proton build $TAG. Community build; see README.md and PATCHES.md."
          fi
