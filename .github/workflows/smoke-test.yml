# Compares an EX-Proton build artifact with the official Proton-GE release it is
# based on, and starts both headlessly inside the Steam Runtime SDK container
# (`proton run cmd /c echo`). The GE run is the control: if GE passes and
# EX-Proton does not, the fault is in what this repository adds.

name: Smoke test

on:
  workflow_dispatch:
    inputs:
      run-id:
        description: "Build EX-Proton run id to take the tarball from"
        required: true
        type: string
      build-name:
        description: "Build name of that run"
        required: false
        default: "EX-Proton11-1"
        type: string
      ge-tag:
        description: "Proton-GE release to compare with"
        required: false
        default: "GE-Proton11-12"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    name: Compare and run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_ID: ${{ inputs.run-id }}
      BUILD_NAME: ${{ inputs.build-name }}
      GE_TAG: ${{ inputs.ge-tag }}
      SDK_IMAGE: registry.gitlab.steamos.cloud/proton/steamrt4/sdk/x86_64:4.0.20260714.251823-0
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "bad run id" >&2; exit 1; }
          [[ "$BUILD_NAME" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "bad build name" >&2; exit 1; }
          [[ "$GE_TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "bad GE tag" >&2; exit 1; }

      - name: Download both tarballs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dl/ex dl/ge t/ex t/ge out
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n "${BUILD_NAME}.tar.gz" -D dl/ex
          gh release download "$GE_TAG" -R GloriousEggroll/proton-ge-custom -p "${GE_TAG}.tar.gz" -D dl/ge
          ls -l dl/ex dl/ge
          tar -xzf "dl/ex/${BUILD_NAME}.tar.gz" -C t/ex
          tar -xzf "dl/ge/${GE_TAG}.tar.gz" -C t/ge
          rm -rf dl
          df -h .

      - name: Compare layout
        shell: bash
        run: |
          set -uo pipefail
          ex="t/ex/$BUILD_NAME"; ge="t/ge/$GE_TAG"
          ls -la "$ex" "$ge"
          ( cd "$ex" && find . -printf '%M %y %P\n' | LC_ALL=C sort ) > out/ex-files.txt
          ( cd "$ge" && find . -printf '%M %y %P\n' | LC_ALL=C sort ) > out/ge-files.txt
          wc -l out/ex-files.txt out/ge-files.txt
          diff out/ge-files.txt out/ex-files.txt > out/files.diff
          echo "== entries only in GE (<) or only in EX-Proton (>), or with different mode/type: $(grep -c '^[<>]' out/files.diff)"
          head -n 300 out/files.diff
          ( cd "$ex" && find . -type l -printf '%P -> %l\n' | LC_ALL=C sort ) > out/ex-links.txt
          ( cd "$ge" && find . -type l -printf '%P -> %l\n' | LC_ALL=C sort ) > out/ge-links.txt
          echo "== symlink differences"; diff out/ge-links.txt out/ex-links.txt | head -n 100
          for f in proton toolmanifest.vdf compatibilitytool.vdf version user_settings.sample.py; do
            echo "== diff $f"; diff -u "$ge/$f" "$ex/$f" | head -n 200
          done
          echo "== sizes (bytes, GE then EX-Proton)"
          ( cd "$ge" && find . -type f -printf '%s %P\n' | LC_ALL=C sort -k2 ) > out/ge-sizes.txt
          ( cd "$ex" && find . -type f -printf '%s %P\n' | LC_ALL=C sort -k2 ) > out/ex-sizes.txt
          du -sb "$ge" "$ex"
          # Files whose size differs by more than 20% (rebuilt binaries differ a little anyway).
          join -1 2 -2 2 out/ge-sizes.txt out/ex-sizes.txt \
            | awk '{ g=$2; e=$3; d=(g>e?g-e:e-g); if (g+e>0 && d*5 > (g>e?g:e) && d>4096) print $0 }' \
            > out/size-outliers.txt
          echo "== files with >20% size difference: $(wc -l < out/size-outliers.txt)"
          head -n 150 out/size-outliers.txt
          exit 0

      - name: Pull SDK image
        run: docker pull "$SDK_IMAGE"

      - name: Run both (GE is the control)
        shell: bash
        run: |
          set -uo pipefail
          cat > t/smoke.sh <<'EOF'
          #!/bin/bash
          # $1 = tool directory name under /t, $2 = label
          export HOME=/tmp/home STEAM_COMPAT_CLIENT_INSTALL_PATH=/tmp/steam
          export STEAM_COMPAT_DATA_PATH=/tmp/compat SteamAppId=0 SteamGameId=0
          export PROTON_LOG=1 PROTON_LOG_DIR=/out WINEDEBUG=+err,+seh,+loaddll
          mkdir -p "$HOME" "$STEAM_COMPAT_CLIENT_INSTALL_PATH" "$STEAM_COMPAT_DATA_PATH"
          cd "/t/$1" || exit 90
          start=$(date +%s)
          timeout -k 10 600 ./proton run cmd /c "echo SMOKE-OK-$2"
          rc=$?
          echo "[$2] exit status $rc after $(( $(date +%s) - start ))s (124 = timed out, i.e. hung)"
          echo "[$2] processes still alive:"; ps -eo pid,etimes,stat,args | grep -i -E 'wine|proton|\.exe' | grep -v grep
          ls -la "$STEAM_COMPAT_DATA_PATH" 2>/dev/null
          exit $rc
          EOF
          chmod +x t/smoke.sh
          status=0
          for pair in "ge/$GE_TAG ge" "ex/$BUILD_NAME ex"; do
            set -- $pair
            echo "::group::smoke $2"
            docker run --rm --init -v "$PWD/t:/t" -v "$PWD/out:/out" "$SDK_IMAGE" \
              /t/smoke.sh "$1" "$2" > "out/smoke-$2.txt" 2>&1
            rc=$?
            echo "$2 rc=$rc" | tee -a out/summary.txt
            tail -n 250 "out/smoke-$2.txt"
            echo "::endgroup::"
            [ "$2" = ex ] && status=$rc
          done
          echo "== summary"; cat out/summary.txt
          grep -c "SMOKE-OK" out/smoke-ge.txt out/smoke-ex.txt
          exit "$status"

      - name: Upload comparison and logs
        if: always()
        uses: actions/upload-artifact@v5.0.0
        with:
          name: smoke-test-output
          path: out/
          if-no-files-found: warn
