# Uploads the media-related Wine sources as they are after scripts/prepare.sh
# (Proton-GE's patches plus ours), and the same directories from the unpatched
# Wine pin, for reviewing differences. Diagnostic only; builds nothing.

name: Dump patched media sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          submodules: false

      - name: Prepare Proton tree
        run: ./scripts/prepare.sh --jobs "$(nproc)"

      - name: Collect sources
        shell: bash
        run: |
          set -euo pipefail
          dirs="dlls/winedmo dlls/mfmediaengine dlls/mf dlls/mfplat dlls/mfreadwrite dlls/mfsrcsnk dlls/evr"
          mkdir -p dump/patched dump/orig
          for d in $dirs; do
            [ -d "proton/wine/$d" ] && tar -C proton/wine -cf - --exclude=tests "$d" | tar -C dump/patched -xf -
          done
          git -C proton/wine archive HEAD dlls/winegstreamer dlls/winedmo dlls/mfmediaengine dlls/mf dlls/mfreadwrite dlls/mfsrcsnk \
            | tar -C dump/orig -xf - --exclude=tests
          tar -czf media-sources.tar.gz dump
          ls -l media-sources.tar.gz

      - name: Upload
        uses: actions/upload-artifact@v5.0.0
        with:
          name: media-sources
          path: media-sources.tar.gz
