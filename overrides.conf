# EX-Proton submodule overrides.
# Format: <path-inside-proton> <git-url> <full-40-char-commit-sha>
# scripts/prepare.sh re-points the submodule to this repo/commit BEFORE Proton-GE's
# own patch script runs, so GE's patches for that component must still apply to
# the replacement (prepare.sh fails if they do not).
#
# No overrides are enabled in the GE-Proton11-12 baseline. Candidates are listed
# in PATCHES.md and are enabled here only after an apply check against GE's
# patches for that component.
