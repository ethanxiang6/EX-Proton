# EX-Proton extra source trees.
# Format: <new-path-inside-proton> <git-url> <full-40-char-commit-sha>
# scripts/prepare.sh clones each of these into the Proton tree. They are built
# by the rules added in patches/proton/ and are opt-in at run time; see
# PATCHES.md.

# netborg-afps low-latency DXVK, release "3.1.1-low-latency" (the commit
# proton-cachyos and DW-Proton pin). Enabled per game with PROTON_DXVK_LOWLATENCY=1.
extras/dxvk-low-latency https://github.com/netborg-afps/dxvk-low-latency.git d533db09df35453ed1baa1b0c7d86de2b67bf504

# netborg-afps low-latency vkd3d-proton (the commit proton-cachyos and DW-Proton
# pin). Enabled per game with PROTON_VKD3D_LOWLATENCY=1.
extras/vkd3d-low-latency https://github.com/netborg-afps/vkd3d-low-latency.git f4e0518cdd35fee0629e25367422bcbc17cbc122

# Korthos low_latency_layer (Vulkan layer; the commit Proton-GE GE-Proton11-12
# pins) and the Vulkan-Utility-Libraries it is built against (build-time only).
# Enabled per game with LOW_LATENCY_LAYER=1.
extras/low_latency_layer https://github.com/Korthos-Software/low_latency_layer.git 4e7fe12b797d89be07919acf3d2df5cda3f4d89f
extras/Vulkan-Utility-Libraries https://github.com/KhronosGroup/Vulkan-Utility-Libraries.git b538fb5b08513aa78346cd414ad5e576a2a3e920
# Vulkan headers for building the layer (Proton-GE's Vulkan-Headers pin; the
# base's own pin is older than Vulkan-Utility-Libraries needs). Build-time only.
extras/Vulkan-Headers-layer https://github.com/KhronosGroup/Vulkan-Headers.git 36872f9062b17b1a30b8ed1d81ca5ea6bb608a72

# umu-protonfixes (the commit Proton-GE GE-Proton11-12 pins): per-game fixes
# and the upscaler download helper behind PROTON_FSR4_UPGRADE=1.
extras/protonfixes https://github.com/open-wine-components/umu-protonfixes.git 28a02c25e4b895131c9ebdeda411ec3646b38151
